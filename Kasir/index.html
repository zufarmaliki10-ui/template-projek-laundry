<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="min-h-screen flex flex-col">
      <!-- Navbar -->
      <nav
        class="fixed top-0 right-0 left-0 h-20 flex bg-teal-800 z-50 justify-center"

        <h1

      <!-- Navbar -->
      <!-- Main Content -->

          Selamat Datang, Kasir
        </h3>
        <h3 class="text-center text-3xl my-3">
          Silahkan pilih menu dibawah ini terlebih dahulu
        </h3>
        <div class="m-3">
          <!-- Card -->
          <div
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 py-3"

            <!-- Card 1 -->
            <a
              href="transaksi.html"
              class="h-50 rounded-lg p-3 flex flex-col justify-center items-center bg-white border border-gray-200 shadow-xl shadow-gray-400/50 hover:-translate-y-1 hover:shadow-xl hover:shadow-gray-400/60 hover:cursor-pointer transition-all duration-300 ease-out"
            >
              <!-- Card Content -->
              <div
                class="bi bi-cash-stack text-4xl border w-20 h-20 flex justify-center items-center bg-green-800 text-white rounded-full"

            </a>
            <!-- Card 1 -->
            <!-- Card 2 -->
            <a

              <!-- Card Content -->
            </a>
            <!-- Card 2 -->
            <!-- Card 3 -->

            >
              <!-- Card Content -->
              <div
                class="bi bi-file-earmark-spreadsheet-fill text-4xl border w-20 h-20 flex justify-center items-center bg-blue-800 text-white rounded-full"
              ></div>
              <h1 class="text-3xl mt-3">Generate Laporan</h1>
              <!-- Card Content -->
            </a>
            <!-- Card 3 -->
          </div>
          <!-- Card -->
        </div>
      </main>
      <!-- Main Content -->
      <!-- Footer -->
      <footer
        class="h-20 flex flex-col items-center justify-center border-t border-gray-300"
      >
        <p>
          Created by
          <a href="" class="text-blue-500 font-semibold">OmahCreative</a>
        </p>
        <p>&copy;2026</p>

      <!-- Footer -->
    </div>
