<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="min-h-screen flex flex-col">
      <!-- Navbar -->
      <nav
        class="fixed top-0 left-0 right-0 h-20 flex bg-teal-800 z-50 justify-center"
      >
        <h1
          class="font-bold text-3xl flex justify-center items-center w-1/2 text-center text-white"
        >
          Laundry<span class="text-yellow-300">Kilat</span>
        </h1>
      </nav>
      <!-- Navbar -->

      <!-- Main Content -->
      <main class="flex-1 pt-20">
        <a
          href="index.html"
          class="bi bi-arrow-left-circle-fill bg-blue-400 py-1.5 px-2 flex w-max items-center m-2 text-white rounded-md hover:-translate-y-1 hover:bg-blue-500 hover:shadow-md hover:shadow-blue-600/50 transition-all duration-150 ease-in-out"
        >
          <span class="mx-0.5">Kembali</span>
        </a>

        <h3
          class="text-center w-1/2 mx-auto text-2xl mb-5 font-bold border-b-2 pb-3 border-gray-400/50 shadow-md shadow-gray-400/50"
        >
          Form Pelanggan Baru
        </h3>

        <div class="flex justify-center">
          <form action="" class="px-3 py-1">
            <div class="flex flex-col mb-3">
              <label for="" class="text-lg font-semibold mb-1"
                >Nama Pelanggan</label
              >
              <input
                type="text"
                placeholder="Masukkan nama outlet..."
                class="w-100 h-10 outline-none border-b-2 border-gray-400 py-1 px-2 placeholder:text-gray-400 focus:border-blue-500 transition duration-300"
              />
            </div>
            <div class="flex flex-col mb-3">
              <label for="" class="text-lg font-semibold mb-1"
                >Nomer Telepon</label
              >
              <input
                type="text"
                placeholder="Masukkan nomer telepon..."
                class="w-100 h-10 outline-none border-b-2 border-gray-400 py-1 px-2 placeholder:text-gray-400 focus:border-blue-500 transition duration-300"
              />
            </div>
            <div class="flex flex-col mb-3">
              <label class="text-lg flex flex-col font-semibold mb-1">
                Paket Tambahan
              </label>

              <select
                name=""
                id=""
                class="w-100 h-10 outline-none border-2 rounded-lg border-gray-400 py-1 px-2 placeholder:text-gray-400 focus:border-blue-500 transition duration-300"
              >
                <option value="">Laki-Laki</option>
                <option value="">Perempuan</option>
              </select>
            </div>
            <div class="flex flex-col mb-3">
              <label for="" class="text-lg font-semibold mb-1"
                >Alamat Outlet</label
              >
              <textarea
                name=""
                id=""
                placeholder="Masukkan alamat..."
                class="w-100 h-30 border border-gray-400 rounded-lg p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all duration-200"
              ></textarea>
            </div>
            <button
              type="submit"
              class="py-1.5 rounded-md w-100 bg-green-800 text-white cursor-pointer hover:bg-green-700 hover:-translate-y-1 transition-all duration-150 ease-in-out"
            >
              Tambah
            </button>
          </form>
        </div>
      </main>
      <!-- Main Content -->

      <!-- Footer -->
      <footer
        class="h-20 mt-10 shrink-0 flex flex-col items-center justify-center border-t border-gray-300"
      >
        <p>
          Created by
          <a href="" class="text-blue-500 font-semibold"> OmahCreative </a>
        </p>

        <p>&copy;2026</p>
      </footer>
      <!-- Footer -->
    </div>
  </body>
</html>
