<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <!-- SIDEBAR -->
    <aside class="fixed top-0 left-0 w-45 h-screen bg-blue-900 px-2">
      <h1 class="font-bold text-2xl mt-5 py-3 text-center text-white">
        Laundry<span class="text-yellow-300">Kilat</span>
      </h1>

      <div class="my-3">
        <a
          class="block py-2 px-3 my-2 rounded-md font-semibold text-white hover:bg-yellow-500 hover:text-black hover:-translate-y-1 hover:scale-100 transition-all duration-300 ease-in-out bi bi-speedometer"
          href="index.html"
        >
          Dashboard
        </a>

        <a
          class="block py-2 px-3 my-2 rounded-md font-semibold text-white hover:bg-yellow-500 hover:text-black hover:-translate-y-1 hover:scale-100 transition-all duration-300 ease-in-out bi bi-shop"
          href="outlet.html"
        >
          Outlet
        </a>

        <a
          class="block py-2 px-3 my-2 rounded-md font-semibold text-white hover:bg-yellow-500 hover:text-black hover:-translate-y-1 hover:scale-100 transition-all duration-300 ease-in-out bi bi-people-fill"
          href=""
        >
          Users
        </a>

        <a
          class="block py-2 px-3 my-2 rounded-md font-semibold text-white hover:bg-yellow-500 hover:text-black hover:-translate-y-1 hover:scale-100 transition-all duration-300 ease-in-out bi bi-basket3-fill"
          href=""
        >
          Paket
        </a>

        <a
          class="block py-2 px-3 my-2 rounded-md font-semibold text-white hover:bg-yellow-500 hover:text-black hover:-translate-y-1 hover:scale-100 transition-all duration-300 ease-in-out bi bi-credit-card-fill"
          href=""
        >
          Transaksi
        </a>

        <div class="h-0.5 bg-white rounded-md"></div>

        <a
          class="block py-2 px-3 my-2 rounded-md font-semibold text-white hover:bg-red-700 hover:text-white hover:-translate-y-1 hover:scale-100 transition-all duration-300 ease-in-out bi bi-door-open-fill"
          href=""
        >
          Logout
        </a>
      </div>
    </aside>

    <!-- AREA KANAN -->
    <main class="ml-45 flex-1 min-h-screen">
      <!-- NAVBAR -->
      <nav
        class="fixed top-0 right-0 left-45 h-15 flex bg-teal-300 z-50 justify-between"
      >
        <div class="w-1/3 items-center flex px-2">
          <input
            type="search"
            placeholder="search..."
            class="flex-1 bg-gray-100 rounded-tl-md rounded-bl-md p-2 text-sm h-8 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300"
          />
          <button
            class="bi bi-search text-white bg-gray-500 h-8 w-8 rounded-tr-md rounded-br-md cursor-pointer shrink-0 hover:bg-gray-400 transition duration-100 ease-in-out"
          ></button>
        </div>

        <div class="w-1/3 items-center justify-end gap-1 flex px-2">
          <div class="w-1/2 text-end px-3">
            <p>Nama Admin</p>
            <p>Admin</p>
          </div>
          <div class="w-max">
            <p
              class="w-12 h-12 rounded-full flex items-center justify-center bg-white text-2xl"
            >
              A
            </p>
          </div>
        </div>
      </nav>

      <!-- CONTENT -->
      <div class="pt-15 min-h-screen flex flex-col">
        <div class="flex-1 p-5">
          <p class="text-3xl font-semibold text-gray-600">OUTLET</p>
          <a
            href="form.html"
            class="bi bi-plus-square-fill inline-flex items-center bg-blue-600 px-3 py-2 my-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-blue-900 hover:bg-blue-500 transition-all duration-150 ease-in-out"
          >
            <span class="mx-1.5">Tambah</span>
          </a>
          <!-- Contoh content panjang -->
          <div class="h-max mt-3">
            <table
              class="w-full table-auto text-center [&_th]:border-b-2 [&_th]:border-gray-400 [&_th]:h-10 [&_td]:h-15"
            >
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Outlet</th>
                  <th>Alamat</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  class="odd:bg-gray-200 even:bg-white hover:bg-gray-300 transition-colors duration-200"
                >
                  <td>1</td>
                  <td>Outlet Jakarta</td>
                  <td>Jakarta Utara</td>
                  <td class="flex gap-1 justify-center items-center">
                    <a
                      href=""
                      class="bi bi-arrow-clockwise inline-flex w-8 h-8 items-center justify-center bg-green-800 p-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-green-900 hover:bg-green-700 transition-all duration-150 ease-in-out"
                    >
                    </a>
                    <a
                      href=""
                      class="bi bi-plus-square-fill inline-flex w-8 h-8 items-center justify-center bg-yellow-500 p-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-green-900 hover:bg-yellow-700 transition-all duration-150 ease-in-out"
                    >
                    </a>
                    <a
                      href=""
                      class="bi bi-trash-fill inline-flex w-8 h-8 items-center justify-center bg-red-800 p-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-red-900 hover:bg-red-700 transition-all duration-150 ease-in-out"
                    >
                    </a>
                  </td>
                </tr>
                <tr
                  class="odd:bg-gray-200 even:bg-white hover:bg-gray-300 transition-colors duration-200"
                >
                  <td>2</td>
                  <td>Outlet Jakarta</td>
                  <td>Jakarta Utara</td>
                  <td class="flex gap-1 justify-center items-center">
                    <a
                      href=""
                      class="bi bi-arrow-clockwise inline-flex w-8 h-8 items-center justify-center bg-green-800 p-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-green-900 hover:bg-green-700 transition-all duration-150 ease-in-out"
                    >
                    </a>
                    <a
                      href=""
                      class="bi bi-plus-square-fill inline-flex w-8 h-8 items-center justify-center bg-yellow-500 p-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-green-900 hover:bg-yellow-700 transition-all duration-150 ease-in-out"
                    >
                    </a>
                    <a
                      href=""
                      class="bi bi-trash-fill inline-flex w-8 h-8 items-center justify-center bg-red-800 p-2 text-white text-sm rounded-md cursor-pointer hover:-translate-y-0.5 hover:shadow hover:shadow-red-900 hover:bg-red-700 transition-all duration-150 ease-in-out"
                    >
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- FOOTER -->
        <footer
          class="h-20 flex flex-col items-center justify-center border-t border-gray-300"
        >
          <p>
            Created by
            <a href="" class="text-blue-500 font-semibold">OmahCreative</a>
          </p>
          <p>&copy;2026</p>
        </footer>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
