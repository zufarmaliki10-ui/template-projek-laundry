<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="min-h-screen flex justify-center items-center bg-teal-800">
      <div class="border border-white bg-white rounded-3xl p-10">
        <form action="" class="px-3 py-1">
          <div class="flex flex-col mb-3">
            <label for="" class="text-lg font-semibold mb-1">Email User</label>
            <input
              type="text"
              placeholder="Masukkan email anda..."
              class="w-100 h-10 outline-none border-b-2 border-black py-1 px-2 placeholder:text-gray-500 focus:border-blue-500 transition duration-300"
            />
          </div>
          <div class="flex flex-col mb-3">
            <label for="" class="text-lg font-semibold mb-1">Password</label>
            <input
              type="password"
              placeholder="Masukkan password anda..."
              class="w-100 h-10 outline-none border-b-2 border-black py-1 px-2 placeholder:text-gray-500 focus:border-blue-500 transition duration-300"
            />
          </div>
          <button
            type="submit"
            class="py-1.5 flex mx-auto mt-5 justify-center rounded-md w-1/2 bg-blue-500 text-white cursor-pointer font-semibold hover:bg-blue-600 hover:-translate-y-1 hover:shadow-md hover:shadow-blue-600 transition-all duration-150 ease-in-out"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
